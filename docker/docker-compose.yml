version: "3.8"

services:
  regime-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: multi-regime-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5555}:5555"
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro
      - ../logs:/app/logs
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    mem_limit: 1g
    cpus: 2.0
